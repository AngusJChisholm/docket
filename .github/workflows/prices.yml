name: Weekly prices

on:
  schedule:
    - cron: '0 19 * * 2' # Wednesday 6am Melbourne (5am in winter), after the specials flip
  workflow_dispatch: {}  # "Run workflow" button for a manual refresh

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch and match this week's prices
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/update-prices.mjs
      - name: Publish
        run: |
          git config user.name "Angus Chisholm"
          git config user.email "AngusJChisholm@users.noreply.github.com"
          git add js/prices.js data/catalogue.json data/feed index.html plan.html admin/prices.html
          git diff --cached --quiet || git commit -m "Prices for the week of $(TZ=Australia/Melbourne date +%-d\ %b)"
          git push
